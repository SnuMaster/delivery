name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run behavior tests
        run: |
          node --check app.js
          node --check cloud.js
          node --check gmail.js
          node --check supabase/functions/iphone-shortcut-ingest/iphone-shortcut.js
          node --check supabase/functions/iphone-shortcut-ingest/index.js
          node --check supabase/functions/iphone-shortcut-setup/index.js
          npm test
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html app.js cloud.js gmail.js lib.js styles.css supabase-config.js _site/
      - name: Verify deploy artifact
        run: |
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/cloud.js
          test -f _site/gmail.js
          test -f _site/lib.js
          test -f _site/styles.css
          test -f _site/supabase-config.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate-and-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

